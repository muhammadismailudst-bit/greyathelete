<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>Grey Athlete Kit Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login -->
<section class="login" id="loginView" hidden>
  <form class="login-box" id="loginForm" novalidate>
    <h1>Kit Log</h1>
    <p class="muted">Enter the staff PIN</p>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="12" aria-label="PIN">
    <button class="primary" id="loginBtn" type="submit">Unlock</button>
    <p class="msg" id="loginMsg" role="status"></p>
  </form>
</section>

<!-- Setup needed -->
<section class="login" id="setupView" hidden>
  <div class="login-box">
    <h1>Kit Log</h1>
    <p class="muted">This site isn't connected to its database yet. Fill in <b>config.js</b> with your Supabase project URL and anon key (see README).</p>
  </div>
</section>

<!-- App -->
<div id="appView" hidden>
  <div class="page">
    <header class="pad">
      <div class="title-row">
        <h1>Kit Log</h1>
        <div class="title-right">
          <span class="count" id="count"></span>
          <button class="link" id="lockBtn" type="button">Lock</button>
        </div>
      </div>
      <input id="qSearch" type="search" placeholder="Search name, gym or note" aria-label="Search" autocomplete="off">
      <div class="filters">
        <select id="qBatch" aria-label="Filter by batch"><option value="">All batches</option></select>
        <select id="qGym" aria-label="Filter by gym"><option value="">All gyms</option></select>
      </div>
    </header>

    <div class="pad">
      <div class="status" id="status" hidden></div>
      <div id="list"></div>
    </div>
  </div>

  <div class="fab-bar"><button class="fab" id="addBtn" type="button">+ Add person</button></div>
</div>

<!-- Add / edit sheet -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="panel" id="form" novalidate>
    <div class="panel-head">
      <button type="button" class="link" id="closeBtn">Cancel</button>
      <h2 id="sheetTitle">Add person</h2>
      <button type="submit" class="link strong" id="saveBtn">Save</button>
    </div>
    <div class="panel-body">
      <label class="field"><span class="lbl">Name</span><input id="fName" autocomplete="off" maxlength="80" placeholder="Full name"></label>
      <label class="field"><span class="lbl">Gym</span><input id="fGym" list="gymList" autocomplete="off" maxlength="80" placeholder="Gym name"></label>
      <div class="field"><span class="lbl">Level</span><div class="seg" id="segLevel"></div></div>
      <div class="field"><span class="lbl">T-shirt size</span><div class="seg" id="segSize"></div></div>
      <div class="two">
        <label class="field"><span class="lbl">Batch</span><input id="fBatch" list="batchList" autocomplete="off" maxlength="40" placeholder="T-100"></label>
        <label class="field"><span class="lbl">Date</span><input id="fDate" type="date"></label>
      </div>
      <div class="field"><span class="lbl">Items given</span><div class="checklist" id="checklist"></div></div>
      <label class="field"><span class="lbl">Note</span><textarea id="fNote" maxlength="1000" placeholder="Optional"></textarea></label>
      <div class="msg" id="formMsg" role="status"></div>
      <button type="button" class="btn-sm danger" id="deleteBtn" hidden>Delete person</button>
    </div>
  </form>
</div>

<datalist id="gymList"></datalist>
<datalist id="batchList"></datalist>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
